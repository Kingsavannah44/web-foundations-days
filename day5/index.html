<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: #222222;
      --border: #cccccc;
      --accent: #4caf50;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      padding: 2rem;
    }

    h1 { margin-bottom: 1.25rem; }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    button {
      padding: 0.55rem 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    label { font-weight: bold; }

    input {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      width: 220px;
    }

    #status {
      margin-bottom: 1rem;
      font-style: italic;
      color: #555;
    }

    #users-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    #users-list li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }

    .user-name    { font-weight: bold; font-size: 1.05rem; margin-bottom: 0.3rem; }
    .user-detail  { font-size: 0.9rem; color: #555; margin-bottom: 0.2rem; }
  </style>
</head>
<body>
  <h1>User Directory</h1>

  <div class="controls">
    <button id="load-users">Load Users</button>
    <label for="filter-input">Filter by name:</label>
    <input id="filter-input" type="text" placeholder="Type a name…">
  </div>

  <p id="status"></p>
  <ul id="users-list"></ul>

  <script src="users.js" defer></script>
</body>
</html>
